# /etc/nginx/sites-available/de-olho-na-rua
#
# App "De Olho na Rua" - dois dominios servindo a MESMA interface e o MESMO banco.
# Troque as duas coisas antes de copiar:
#   1. SEU_DOMINIO_NEUTRO.com.br  -> o dominio novo, sem relacao com o municipio
#   2. brusque.app.br             -> o dominio atual (se for outro, ajuste)
#
# NAO use try_files aqui: o app e servidor (TanStack Start), nao um site estatico.

upstream deolho_app {
    server 127.0.0.1:3000;
    keepalive 8;
}

# ---------- HTTP: redireciona os dois dominios para HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name
        brusque.app.br
        www.brusque.app.br
        SEU_DOMINIO_NEUTRO.com.br
        www.SEU_DOMINIO_NEUTRO.com.br;

    # permite o certbot renovar os certificados
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS: dominio atual ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name brusque.app.br www.brusque.app.br;

    ssl_certificate     /etc/letsencrypt/live/brusque.app.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brusque.app.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 8m;

    location / {
        proxy_pass http://deolho_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ---------- HTTPS: dominio novo (neutro) ----------
# Mesma aplicacao, mesmo banco. So muda o server_name e o certificado.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name SEU_DOMINIO_NEUTRO.com.br www.SEU_DOMINIO_NEUTRO.com.br;

    ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO_NEUTRO.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO_NEUTRO.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 8m;

    location / {
        proxy_pass http://deolho_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
